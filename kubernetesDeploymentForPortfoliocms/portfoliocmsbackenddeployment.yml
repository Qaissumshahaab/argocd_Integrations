apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfoliocms-backend-deployment
  labels:
    app: portfoliocmsbackend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: portfoliocmsbackend

  template:
    metadata:
      labels:
        app: portfoliocmsbackend

    spec:
      containers:
        - name: portfoliocmsbackend
          image: muhammadqaissum/portfoliocmsbackendimages:v1

          ports:
            - containerPort: 5001

          env:
            - name: MONGODB_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: MONGODB_URL

            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: PORT

            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: CLOUDINARY_CLOUD_NAME

            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: CLOUDINARY_API_KEY

            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: CLOUDINARY_API_SECRET

            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: FRONTEND_URL
